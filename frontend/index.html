<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kigali Traffic Insight - Nyabugogo</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="sim-banner" role="note">
    <strong>Simulated data.</strong>
    This prototype shows simulated traffic, not live conditions. Always follow official traffic instructions.
  </div>

  <header class="site-header">
    <div class="wrap">
      <h1>Kigali Traffic Insight</h1>
      <p class="subtitle">Nyabugogo terminal and nearby intersections</p>
    </div>
  </header>

  <main class="wrap">
    <section id="summary" class="summary" aria-live="polite" aria-label="Traffic summary"></section>

    <section aria-labelledby="roads-title">
      <h2 id="roads-title">Traffic conditions</h2>
      <div id="roads" class="road-grid"></div>
    </section>

    <section aria-labelledby="incidents-title">
      <h2 id="incidents-title">Active incidents</h2>
      <ul id="incidents" class="incident-list"></ul>
    </section>

    <div class="toolbar">
      <button id="refresh" type="button" class="btn">Refresh now</button>
      <span id="status" role="status" aria-live="polite"></span>
    </div>
  </main>

  <script type="module" src="js/main.js"></script>
</body>
</html>
